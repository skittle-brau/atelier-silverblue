name: Build and Push Custom Silverblue Image
on:
  schedule:
    - cron: '0 0 * * 1' # Runs automatically every Monday at midnight (UTC)
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
  workflow_dispatch: # Allows manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required if you ever want to use keyless signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Cosign tool
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0 # Check for latest version

      # Log in to GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the image using Buildah
      - name: Build and push image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          containerfiles: |
            ./Containerfile
          oci: true

      # Push the image to GHCR and capture the output digest
      - name: Push to GHCR
        id: push-image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          registry: ${{ env.REGISTRY }}

      # Sign the image using the captured digest
      - name: Sign the published image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TAGS: latest
        run: |
          # The digest is critical because signing by tag is vulnerable to race conditions
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push-image.outputs.digest }}"
